stages:
  - test
  - mirror

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python -m py_compile face_privacy.py web_app.py
    - python face_privacy.py --help

mirror-github:
  stage: mirror
  image: alpine/git
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - |
      if [ -z "$GITHUB_MIRROR_URL" ]; then
        echo "GITHUB_MIRROR_URL variable not set; skipping mirror."
        exit 0
      fi
      git remote add github "$GITHUB_MIRROR_URL" || git remote set-url github "$GITHUB_MIRROR_URL"
      git push --force --tags github "HEAD:$CI_COMMIT_REF_NAME"
